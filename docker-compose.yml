version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: homespecter-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: homespecter
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - homespecter-network

  app:
    build: .
    container_name: homespecter-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/homespecter
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads
    networks:
      - homespecter-network

volumes:
  mongodb_data:

networks:
  homespecter-network:
    driver: bridge
